name: Improvement proposal
description: Propose a measured improvement to EFWH
title: "[proposal] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Observed problem or friction
      description: Prefer a concrete failure mode over a speculative feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: evaluation
    attributes:
      label: How would we know it helped?
